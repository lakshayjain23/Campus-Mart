<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Mart — Your Campus. Your Marketplace.</title>
    <meta name="description" content="Discover affordable products, pre-owned gear, books, hostel essentials, and student creations within your Indian college community." />
    <link rel="canonical" href="https://campusmarttt.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://campusmarttt.vercel.app/" />
    <meta property="og:site_name" content="CampusMart" />
    <meta property="og:title" content="Campus Mart — Safe Peer-to-Peer Marketplace for College Students" />
    <meta property="og:description" content="Buy, sell, and exchange books, electronics, hostel gear, and study materials safely within verified Indian campus communities." />
    <meta property="og:image" content="https://campusmarttt.vercel.app/icons.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Campus Mart — Student Marketplace" />
    <meta name="twitter:description" content="Buy and sell textbooks, electronics, and room essentials directly with fellow students on campus." />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://campusmarttt.vercel.app/#website",
          "url": "https://campusmarttt.vercel.app/",
          "name": "CampusMart",
          "description": "Safe peer-to-peer marketplace for Indian college students",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://campusmarttt.vercel.app/explore?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://campusmarttt.vercel.app/#organization",
          "name": "CampusMart",
          "url": "https://campusmarttt.vercel.app/",
          "logo": "https://campusmarttt.vercel.app/favicon.svg"
        }
      ]
    }
    </script>
